name: 술값배틀 · 검증된 종가 입력 및 사이트 배포

on:
  push:
    branches: [main]
    paths: ['inputs/closing-prices.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sool-manual-pages
  cancel-in-progress: false

jobs:
  manual-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: 최신 입력 파일인지 확인
        id: input
        run: |
          event_input_sha="$(git rev-parse HEAD:inputs/closing-prices.json)"
          git fetch origin main
          latest_input_sha="$(git rev-parse origin/main:inputs/closing-prices.json)"
          if [ "$event_input_sha" != "$latest_input_sha" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "더 최신 입력이 있어 오래된 실행을 생략합니다."
            exit 0
          fi
          git checkout -B main origin/main
          echo "current=true" >> "$GITHUB_OUTPUT"
      - name: Python 준비
        if: steps.input.outputs.current == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 입력 파일 검증 및 가격 저장 (외부 API 호출 없음)
        if: steps.input.outputs.current == 'true'
        id: manual
        env:
          INPUT_COMMIT: ${{ github.sha }}
        run: python scripts/manual_update.py --input-file inputs/closing-prices.json
      - name: JSON 저장
        if: steps.manual.outputs.changed == 'true'
        run: |
          git config user.name "sool-battle-manual"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: apply verified closing prices"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        if: steps.manual.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.manual.outputs.changed == 'true'
        with:
          path: .
      - uses: actions/deploy-pages@v4
        if: steps.manual.outputs.changed == 'true'
        id: deployment
